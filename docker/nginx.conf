server {
    listen 8000;
    client_max_body_size 50m;

    location /auth/v1/ {
        # GoTrue refuses the CORS preflight as soon as the browser asks for the
        # "apikey" header, which supabase-js always sends. On Supabase Cloud the
        # preflight is answered by Kong, never by GoTrue itself. Without this,
        # /login and /register fail with "Failed to fetch" while curl works.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, x-client-version, accept, prefer" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            return 204;
        }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /realtime/v1/ {
        proxy_pass http://realtime:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Realtime resolves the tenant from the first label of the Host header,
        # so it has to match SELF_HOST_TENANT_NAME (realtime-dev).
        proxy_set_header Host realtime-dev.supabase-realtime;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health { return 200 "ok\n"; }
    location / { return 404; }
}
